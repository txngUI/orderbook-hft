syntax = "proto3";

package orderbook.v1;

option go_package = "orderbook-hft/internal/pb;pb";

// Side : côté de l'ordre (achat ou vente).
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY         = 1;
  SIDE_SELL        = 2;
}

// OrderType : LIMIT (reste au carnet) ou MARKET (exécution immédiate).
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT       = 1;
  ORDER_TYPE_MARKET      = 2;
}

// OrderRequest : un ordre à soumettre au moteur.
// Price est en TICKS (int32, cf. levier de compacité §3.8).
message OrderRequest {
  uint64    id       = 1;
  Side      side     = 2;
  OrderType type     = 3;
  int32     price    = 4;
  uint64    quantity = 5;
}

// Trade : une transaction produite par l'appariement.
message Trade {
  uint64 buy_order_id  = 1;
  uint64 sell_order_id = 2;
  int32  price         = 3;
  uint64 quantity      = 4;
}

// SubmitResponse : réponse à une soumission d'ordre (0..N trades).
message SubmitResponse {
  repeated Trade trades = 1;
}

// OrderBookService : le service gRPC exposant le moteur.
service OrderBookService {
  // Unaire : équivalent HTTP POST /order (comparable à REST/JSON).
  rpc Submit(OrderRequest) returns (SubmitResponse);

  // Streaming bidirectionnel : le client envoie un flux d'ordres,
  // le serveur renvoie un flux de trades en temps réel (multiplexé HTTP/2).
  // C'est l'atout structurel de gRPC — impossible en REST/1.1.
  rpc StreamOrders(stream OrderRequest) returns (stream Trade);
}